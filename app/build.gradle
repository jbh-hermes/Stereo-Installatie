plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.hoefvinyl.stereoinstallatie'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.hoefvinyl.stereoinstallatie'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0-auto-ip'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
